function showToast(msg,type){const t=document.getElementById('toast');t.textContent=msg;t.className='toast show '+(type||'');setTimeout(()=>t.className='toast',3000)}
function pluralWork(n){const n10=n%10,n100=n%100;if(n10===1&&n100!==11)return'работа';if(n10>=2&&n10<=4&&(n100<10||n100>=20))return'работы';return'работ'}

function calculateItemPrice(item) {
  if (item.hasArea) {
    const area = parseFloat(item.area) || 0;
    if (area <= 9 || area === 0) return item.p;
    return item.p * area;
  }
  if (item.perMeter) return item.p * (item.meters || 1);
  return item.p;
}

function doLogin(){
  const email=document.getElementById('authEmail').value.trim();
  const pass=document.getElementById('authPass').value;
  document.getElementById('authError').textContent='';
  if(!email||!pass){document.getElementById('authError').textContent='Заполни email и пароль';return}
  auth.signInWithEmailAndPassword(email,pass).catch(e=>{document.getElementById('authError').textContent=e.code==='auth/invalid-credential'?'Неверный логин или пароль':e.message})
}

function doRegister(){
  const name=document.getElementById('authName').value.trim();
  const email=document.getElementById('authEmail').value.trim();
  const pass=document.getElementById('authPass').value;
  document.getElementById('authError').textContent='';
  if(!name){document.getElementById('authError').textContent='Укажи своё имя';return}
  if(!email||!pass){document.getElementById('authError').textContent='Заполни email и пароль';return}
  const emailLower = email.toLowerCase();
  const role = (emailLower === BOSS_EMAIL) ? "boss" : "worker";
  auth.createUserWithEmailAndPassword(email,pass).then(cred=>{
    return db.collection('workers').doc(cred.user.uid).set({
      email: emailLower, name, role: role,
      createdAt:firebase.firestore.FieldValue.serverTimestamp()
    });
  }).then(()=>{
    showToast('Регистрация успешна','ok');
    setTimeout(()=>{ auth.signInWithEmailAndPassword(email, pass).catch(e=>{ showToast('Ошибка входа: '+e.message,'reject'); }); }, 1000);
  }).catch(e=>{document.getElementById('authError').textContent=e.message})
}

function doLogout(){auth.signOut();closeMenu()}
function switchAccount(){closeMenu();auth.signOut()}

auth.onAuthStateChanged(async user=>{
  if(!user){
    document.getElementById('authScreen').classList.remove('hidden');
    document.getElementById('app').classList.add('hidden');
    currentUser=null;currentRole=null;workerName='';activeDraftId=null;
    return
  }
  currentUser=user;
  const emailLower = user.email ? user.email.toLowerCase() : '';
  currentRole = ROLES[emailLower] || 'worker';
  try{
    const doc=await db.collection('workers').doc(user.uid).get();
    if(doc.exists){
      const data = doc.data();
      workerName = data.name || user.email.split('@')[0];
      if(data.role) currentRole = data.role;
    }else{
      workerName=user.email.split('@')[0];
      db.collection('workers').doc(user.uid).set({
        email:emailLower, name:workerName, role:currentRole,
        createdAt:firebase.firestore.FieldValue.serverTimestamp()
      });
    }
  }catch(e){ workerName=user.email.split('@')[0]; }
  
  document.getElementById('authScreen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('userInfo').innerHTML='<b>'+workerName+'</b><br>'+user.email+'<br>Роль: '+(currentRole==='boss'?'👔 Руководитель':' Монтажник');
  
  if (currentRole === 'worker') {
    document.getElementById('navStats').style.display = 'flex';
  }
  
  if (currentRole === 'boss') {
    document.getElementById('navWork').style.display = 'none';
    document.getElementById('navStats').style.display = 'none';
    currentTab = 'reports';
  } else {
    document.getElementById('navWork').style.display = 'flex';
  }
  
  subscribeReports();
  renderCurrentScreen()
});

function subscribeReports(){db.collection('reports').orderBy('createdAt','desc').onSnapshot(snap=>{const prevCount=allReports.length;allReports=[];snap.forEach(d=>allReports.push({id:d.id,...d.data()}));if(prevCount>0&&allReports.length>prevCount&&currentRole==='boss'){showToast('🔔 Новый отчёт на проверке','ok')}updateActiveDraftId();renderCurrentScreen()})}

function updateActiveDraftId(){
  if(currentRole!=='worker')return;
  const myDrafts=allReports.filter(r=>r.workerEmail===currentUser.email&&r.status==='draft');
  activeDraftId = myDrafts.length>0 ? myDrafts[0].id : null;
}

function switchTab(tab){
  if (currentRole === 'boss' && (tab === 'work' || tab === 'stats')) return;
  currentTab=tab;
  cancelSelection();
  document.getElementById('navWork').classList.toggle('on',tab==='work');
  document.getElementById('navReports').classList.toggle('on',tab==='reports');
  document.getElementById('navStats').classList.toggle('on',tab==='stats');
  document.getElementById('screenWork').classList.remove('active');
  document.getElementById('screenReports').classList.remove('active');
  document.getElementById('screenStats').classList.remove('active');
  document.getElementById('screenDetail').classList.remove('active');
  if(tab==='work'){
    document.getElementById('screenWork').classList.add('active');
    renderWork();
  }else if(tab==='reports'){
    document.getElementById('screenReports').classList.add('active');
    renderReports();
  }else if(tab==='stats'){
    document.getElementById('screenStats').classList.add('active');
    renderStats();
  }
}

function renderCurrentScreen(){if(currentTab==='work')renderWork();else if(currentTab==='reports')renderReports();else if(currentTab==='stats')renderStats()}

function renderWork(){
  const content=document.getElementById('workContent');
  if(!currentCategory){
    let html='<div class="cat-grid">';
    Object.keys(PRICE).forEach(cat=>{html+='<div class="cat-card" onclick="openCategory(\''+cat.replace(/'/g,"\\'")+'\')"><div class="cat-preview">'+(ICONS[cat]||'')+'</div><div class="cat-name">'+cat+'</div></div>'});
    html+='</div>';
    content.innerHTML=html;
    return
  }
  const works=PRICE[currentCategory];const selected=selectedWorks[currentCategory]||[];const selectedNames=new Set(selected.map(w=>w.n));
  let html='<button class="header-btn" onclick="backToCats()" style="margin-bottom:10px">← Назад</button>';
  html+='<h2 style="margin-bottom:10px;font-size:16px;color:#1a1a1a">'+currentCategory+'</h2>';
  html+='<select class="filter-select" onchange="selectWorkByIndex(this.value)" id="workSelect"><option value="">— Выбрать работу —</option>';
  works.forEach((w,i)=>{html+='<option value="'+i+'" '+(selectedNames.has(w.n)?'disabled':'')+'>'+w.n+' · '+w.p.toLocaleString('ru-RU')+' ₽'+(w.perMeter?' (за 1 м)':'')+'</option>'});
  html+='</select><div id="selectedWorksList"></div>';
  html+='<h3 class="section-title">Дополнительные работы</h3><div id="extraWorksList"></div>';
  html+='<div style="display:grid;grid-template-columns:1fr 80px;gap:4px;margin-top:6px"><input class="extra-input" id="extraName" placeholder="Название" style="margin:0"><input class="extra-input" id="extraPrice" type="number" placeholder="Цена" style="margin:0"></div>';
  html+='<button class="header-btn" onclick="addExtraWork()" style="width:100%;margin-top:6px">+ Добавить доп. работу</button>';
  
  // При редактировании показываем подсказку
  if(editingReportId){
    html+='<div style="background:#eef2ff;border:1px solid #6366f1;border-radius:8px;padding:8px;margin-top:10px;font-size:12px;color:#6366f1">✏️ Режим редактирования: меняйте дату/адрес для каждой работы отдельно</div>';
  }
  
  html+='<div class="report-controls">';
  html+='<div style="font-size:12px;color:#6b7280;margin-bottom:6px">📝 Дата и адрес для НОВЫХ работ:</div>';
  html+='<input type="date" id="workDate" class="extra-input" style="margin:0">';
  html+='<input type="text" id="workAddress" class="extra-input" placeholder="📍 Адрес выполнения работ" style="margin:0">';
  html+='<div style="margin-top:8px"><div class="total-count" id="totalCount">0 работ</div><div class="total-sum" id="totalSum">0 ₽</div></div>';
  html+='<button class="create-btn" id="createReportBtn" onclick="addToReport()">➕ Добавить в отчёт</button>';
  html+='</div>';
  
  content.innerHTML=html;
  renderSelectedWorks();
  renderExtraWorks();
  updateTotal();
  const dateInput=document.getElementById('workDate');
  if(!dateInput.value)dateInput.value=new Date().toISOString().split('T')[0];
  
  if(editingReportId){
    document.getElementById('createReportBtn').textContent='💾 Сохранить изменения';
  }else if(activeDraftId){
    const draft=allReports.find(r=>r.id===activeDraftId);
    if(draft){
      document.getElementById('createReportBtn').textContent='➕ Добавить в отчёт ('+draft.items.length+' работ, '+draft.total.toLocaleString('ru-RU')+' ₽)';
    }
  }else{
    document.getElementById('createReportBtn').textContent='➕ Создать новый отчёт';
  }
}

function openCategory(cat){currentCategory=cat;if(!selectedWorks[cat])selectedWorks[cat]=[];renderWork()}
function backToCats(){currentCategory=null;renderWork()}

function selectWorkByIndex(idx){
  if(idx==='')return;
  const i=parseInt(idx);
  const work=PRICE[currentCategory][i];
  if(!selectedWorks[currentCategory])selectedWorks[currentCategory]=[];
  if(!selectedWorks[currentCategory].find(w=>w.n===work.n)){
    const sel={...work};
    if(work.perMeter){sel.meters=1}
    if(work.hasArea){sel.area=0;sel.mountType=work.mountType||'standard'}
    sel.qty=1;
    // Устанавливаем текущие значения из формы
    const dateInput=document.getElementById('workDate');
    const addressInput=document.getElementById('workAddress');
    sel.workDate=dateInput?dateInput.value:new Date().toISOString().split('T')[0];
    sel.workAddress=addressInput?addressInput.value.trim():'';
    selectedWorks[currentCategory].push(sel)
  }
  document.getElementById('workSelect').value='';
  renderWork()
}

function renderSelectedWorks(){
  const list=document.getElementById('selectedWorksList');
  if(!list)return;
  const works=selectedWorks[currentCategory]||[];
  if(!works.length){list.innerHTML='<div class="empty-state">Работы не выбраны</div>';return}
  let html='';
  works.forEach((w,i)=>{
    const price=calculateItemPrice(w)*(w.qty||1);
    html+='<div class="work-item"><div class="work-info"><div class="work-name">'+w.n+'</div><div class="work-price">'+price.toLocaleString('ru-RU')+' ₽</div>';
    if(w.perMeter){html+='<div class="meter-input"><span>Количество:</span><input type="number" value="'+w.meters+'" min="0.5" step="0.5" onchange="updateMeters('+i+',this.value)"><span>'+w.meterName+'</span></div>'}
    if(w.hasArea){html+='<div class="area-input"><span>Площадь (м²):</span><input type="number" value="'+(w.area||0)+'" min="0" step="0.5" onchange="updateArea('+i+',this.value)"><span>м²</span></div>';if(w.mountType==='high'){html+='<div style="font-size:11px;color:#f59e0b;margin-top:4px">⚡ Высокий монтаж (×1.2)</div>'}}
    html+='<div class="qty-input"><span>Кол-во:</span><input type="number" value="'+(w.qty||1)+'" min="1" step="1" onchange="updateQty('+i+',this.value)"><span>шт</span></div>';
    
    // ИНДИВИДУАЛЬНЫЕ ПОЛЯ ДАТЫ И АДРЕСА ДЛЯ КАЖДОЙ РАБОТЫ
    html+='<div class="edit-work-fields">';
    html+='<div class="field-group"><div class="field-label"> Дата</div><input type="date" value="'+(w.workDate||'')+'" onchange="updateWorkField('+i+',\'workDate\',this.value)"></div>';
    html+='<div class="field-group"><div class="field-label"> Адрес</div><input type="text" value="'+(w.workAddress||'')+'" placeholder="Адрес" onchange="updateWorkField('+i+',\'workAddress\',this.value)"></div>';
    html+='</div>';
    
    html+='</div><button class="mini-btn" onclick="removeWork('+i+')">✕</button></div>'
  });
  list.innerHTML=html
}

// Обновление индивидуального поля работы
function updateWorkField(idx, field, value){
  if(selectedWorks[currentCategory] && selectedWorks[currentCategory][idx]){
    selectedWorks[currentCategory][idx][field] = value;
  }
}

function updateMeters(idx,val){const m=parseFloat(val)||0;selectedWorks[currentCategory][idx].meters=m;updateTotal();renderSelectedWorks()}
function updateArea(idx,val){const a=parseFloat(val)||0;selectedWorks[currentCategory][idx].area=a;updateTotal();renderSelectedWorks()}
function updateQty(idx,val){const q=parseInt(val)||1;selectedWorks[currentCategory][idx].qty=q;updateTotal();renderSelectedWorks()}
function removeWork(idx){selectedWorks[currentCategory].splice(idx,1);renderWork()}

function renderExtraWorks(){const list=document.getElementById('extraWorksList');if(!list)return;if(!extraWorks.length){list.innerHTML='<div class="empty-state">Нет доп. работ</div>';return}
let html='';extraWorks.forEach((w,i)=>{
  html+='<div class="extra-row"><input class="extra-input" value="'+w.n+'" onchange="updateExtra('+i+',\'n\',this.value)" style="margin:0"><input class="extra-input" type="number" value="'+w.p+'" onchange="updateExtra('+i+',\'p\',this.value)" style="margin:0"><button class="mini-btn" onclick="removeExtra('+i+')">✕</button></div>';
  // Индивидуальные поля для доп. работ
  html+='<div class="edit-work-fields">';
  html+='<div class="field-group"><div class="field-label">📅 Дата</div><input type="date" value="'+(w.workDate||'')+'" onchange="updateExtraField('+i+',\'workDate\',this.value)"></div>';
  html+='<div class="field-group"><div class="field-label">📍 Адрес</div><input type="text" value="'+(w.workAddress||'')+'" placeholder="Адрес" onchange="updateExtraField('+i+',\'workAddress\',this.value)"></div>';
  html+='</div>';
});list.innerHTML=html}

function updateExtraField(i, field, value){

// ИСПРАВЛЕННАЯ ФУНКЦИЯ - каждая работа имеет свою дату и адрес
function addToReport(){
  const newItems=[];
  let newTotal=0;
  
  // Собираем работы из всех категорий с их ИНДИВИДУАЛЬНЫМИ датами и адресами
  Object.values(selectedWorks).forEach(works=>{
    works.forEach(w=>{
      const item={cat:w.cat||currentCategory,...w};
      item.totalPrice=calculateItemPrice(w)*(w.qty||1);
      // Используем индивидуальную дату/адрес работы, если есть, иначе из формы
      item.workDate=w.workDate||document.getElementById('workDate')?.value||new Date().toISOString().split('T')[0];
      item.workAddress=w.workAddress||document.getElementById('workAddress')?.value.trim()||'';
      newItems.push(item);
      newTotal+=item.totalPrice;
    });
  });
  extraWorks.forEach(w=>{
    const item={cat:'Допы',...w,isExtra:true,totalPrice:w.p};
    item.workDate=w.workDate||document.getElementById('workDate')?.value||new Date().toISOString().split('T')[0];
    item.workAddress=w.workAddress||document.getElementById('workAddress')?.value.trim()||'';
    newItems.push(item);
    newTotal+=w.p;
  });
  
  if(!newItems.length){showToast('Выбери хотя бы одну работу','reject');return}
  
  const reportWorkerName = workerName || currentUser.email.split('@')[0];
  
  // РЕДАКТИРОВАНИЕ - ПОЛНОСТЬЮ ЗАМЕНЯЕМ работы
  if(editingReportId){
    db.collection('reports').doc(editingReportId).update({
      items:newItems,
      total:newTotal,
      updatedAt:firebase.firestore.FieldValue.serverTimestamp()
    }).then(()=>{
      showToast('Отчёт обновлён ('+newItems.length+' работ)','ok');
      editingReportId=null;
      selectedWorks={};extraWorks=[];currentCategory=null;
      switchTab('reports');
    }).catch(e=>showToast('Ошибка: '+e.message,'reject'));
    return;
  }
  
  // ДОБАВЛЕНИЕ В СУЩЕСТВУЮЩИЙ ЧЕРНОВИК
  if(activeDraftId){
    const draft=allReports.find(r=>r.id===activeDraftId);
    if(!draft){showToast('Черновик не найден','reject');return}
    const updateData={
      items:[...draft.items,...newItems],
      total:draft.total+newTotal,
      updatedAt:firebase.firestore.FieldValue.serverTimestamp()
    };
    db.collection('reports').doc(activeDraftId).update(updateData).then(()=>{
      showToast('Работы добавлены в отчёт (всего: '+(draft.items.length+newItems.length)+' работ)','ok');
      selectedWorks={};extraWorks=[];currentCategory=null;
      switchTab('reports');
    }).catch(e=>showToast('Ошибка: '+e.message,'reject'));
  }else{
    // СОЗДАНИЕ НОВОГО ОТЧЁТА
    const reportData={
      workerEmail:currentUser.email,
      workerName: reportWorkerName,
      items:newItems,
      total:newTotal,
      workDate:newItems[0]?.workDate||new Date().toISOString().split('T')[0],
      workAddress:newItems[0]?.workAddress||'',
      status:'draft',
      bossComment:'',
      expenseComment:'',
      expenseAmount:0,
      createdAt:firebase.firestore.FieldValue.serverTimestamp(),
      updatedAt:firebase.firestore.FieldValue.serverTimestamp()
    };
    db.collection('reports').add(reportData).then(()=>{
      showToast('Новый отчёт создан','ok');
      selectedWorks={};extraWorks=[];currentCategory=null;
      switchTab('reports');
    }).catch(e=>showToast('Ошибка: '+e.message,'reject'));
  }
}

function renderStats(){
  if(currentRole!=='worker')return;
  const content=document.getElementById('statsContent');
  const myReports=allReports.filter(r=>r.workerEmail===currentUser.email&&r.status==='approved');
  
  let html='<h2 style="margin-bottom:12px;font-size:18px;color:#1a1a1a">📊 Статистика заработка</h2>';
  html+='<div class="period-selector">';
  html+='<select class="filter-select" id="statsPeriod" onchange="updateStats()" style="margin:0;flex:1">';
  html+='<option value="month">Этот месяц</option>';
  html+='<option value="lastMonth">Прошлый месяц</option>';
  html+='<option value="quarter">Квартал</option>';
  html+='<option value="year">Год</option>';
  html+='<option value="all">Все время</option>';
  html+='</select>';
  html+='</div>';
  
  const now=new Date();
  const currentMonth=now.getMonth();
  const currentYear=now.getFullYear();
  
  let filteredReports=myReports.filter(r=>{
    if(!r.createdAt) return false;
    const reportDate=r.createdAt.toDate();
    const period=document.getElementById('statsPeriod')?.value||'month';
    if(period==='month'){
      return reportDate.getMonth()===currentMonth && reportDate.getFullYear()===currentYear;
    }else if(period==='lastMonth'){
      const lastMonth=new Date(currentYear,currentMonth-1,1);
      return reportDate.getMonth()===lastMonth.getMonth() && reportDate.getFullYear()===lastMonth.getFullYear();
    }else if(period==='quarter'){
      const quarterStart=new Date(currentYear,Math.floor(currentMonth/3)*3,1);
      return reportDate>=quarterStart;
    }else if(period==='year'){
      return reportDate.getFullYear()===currentYear;
    }
    return true;
  });
  
  let totalEarnings=0;
  filteredReports.forEach(r=>{
    totalEarnings+=r.total||0;
  });
  
  html+='<div class="stats-card">';
  html+='<div class="stats-value">'+totalEarnings.toLocaleString('ru-RU')+' ₽</div>';
  html+='<div class="stats-label">Заработано за период (только работы)</div>';
  html+='</div>';
  
  html+='<div class="stats-card">';
  html+='<div class="stats-value">'+filteredReports.length+'</div>';
  html+='<div class="stats-label">Выполнено отчётов</div>';
  html+='</div>';
  
  content.innerHTML=html;
}

function mergeSelectedReports(){
  if(selectedReportIds.length<2){showToast('Выбери минимум 2 черновика','reject');return}
  if(!confirm('Объединить '+selectedReportIds.length+' черновиков в один отчёт? Исходные черновики будут удалены.'))return;
  const reportsToMerge=allReports.filter(r=>selectedReportIds.includes(r.id));
  let mergedItems=[], mergedTotal=0, allAddresses=[], earliestDate=null;
  reportsToMerge.forEach(r=>{
    mergedItems=mergedItems.concat(r.items||[]);
    mergedTotal+=r.total||0;
    if(r.workAddress&&!allAddresses.includes(r.workAddress))allAddresses.push(r.workAddress);
    if(r.workDate){if(!earliestDate||r.workDate<earliestDate)earliestDate=r.workDate;}
  });
  const mergedReport={
    workerEmail:currentUser.email,
    workerName:workerName,
    items:mergedItems,
    total:mergedTotal,
    workDate:earliestDate||new Date().toISOString().split('T')[0],
    workAddress:allAddresses.join('; '),
    status:'draft',
    bossComment:'',
    expenseComment:'',
    expenseAmount:0,
    mergedFrom:reportsToMerge.map(r=>r.id),
    createdAt:firebase.firestore.FieldValue.serverTimestamp(),
    updatedAt:firebase.firestore.FieldValue.serverTimestamp()
  };
  const deletePromises=reportsToMerge.map(r=>db.collection('reports').doc(r.id).delete());
  Promise.all(deletePromises).then(()=>{
    return db.collection('reports').add(mergedReport);
  }).then(()=>{
    showToast('Черновики объединены ('+reportsToMerge.length+' → 1)','ok');
    cancelSelection();
  }).catch(e=>showToast('Ошибка объединения: '+e.message,'reject'));
}

// ИСПРАВЛЕННАЯ ФУНКЦИЯ - сохраняет индивидуальные даты и адреса для каждой работы
function editReport(id){
  const report=allReports.find(r=>r.id===id);
  if(!report)return;
  editingReportId=id;
  selectedWorks={};extraWorks=[];
  
  // Загружаем каждую работу с её ИНДИВИДУАЛЬНОЙ датой и адресом
  report.items.forEach(item=>{
    if(item.isExtra){
      extraWorks.push({
        n:item.n,p:item.p,
        workDate:item.workDate||'',
        workAddress:item.workAddress||''
      });
    }else{
      if(!selectedWorks[item.cat])selectedWorks[item.cat]=[];
      const sel={
        n:item.n,p:item.p,
        workDate:item.workDate||'',
        workAddress:item.workAddress||''
      };
      if(item.perMeter){sel.perMeter=true;sel.meterName=item.meterName;sel.meters=item.meters||1}
      if(item.hasArea){sel.hasArea=true;sel.area=item.area||0;sel.mountType=item.mountType||'standard'}
      if(item.drive)sel.drive=item.drive;
      sel.qty=item.qty||1;
      selectedWorks[item.cat].push(sel)
    }
  });
  
  currentCategory=null;
  switchTab('work');
  
  // Устанавливаем дату и адрес последней работы в общие поля (как подсказка)
  setTimeout(()=>{
    const dateInput=document.getElementById('workDate');
    const addressInput=document.getElementById('workAddress');
    const lastItem=report.items[report.items.length-1];
    if(dateInput) dateInput.value=lastItem?.workDate||new Date().toISOString().split('T')[0];
    if(addressInput) addressInput.value=lastItem?.workAddress||'';
  },100);
}

}

function approveReport(id){commentAction='approve';commentReportId=id;document.getElementById('commentTitle').textContent='Комментарий (необязательно)';document.getElementById('commentText').value='';document.getElementById('commentModal').classList.add('show')}
function rejectReport(id){commentAction='reject';commentReportId=id;document.getElementById('commentTitle').textContent='Причина отказа';document.getElementById('commentText').value='';document.getElementById('commentModal').classList.add('show')}
function closeComment(){document.getElementById('commentModal').classList.remove('show');commentAction=null;commentReportId=null}
function confirmComment(){const comment=document.getElementById('commentText').value.trim();if(commentAction==='reject'&&!comment){showToast('Укажи причину отказа','reject');return}const newStatus=commentAction==='approve'?'approved':'rejected';db.collection('reports').doc(commentReportId).update({status:newStatus,bossComment:comment,bossEmail:currentUser.email,bossName:workerName,updatedAt:firebase.firestore.FieldValue.serverTimestamp()}).then(()=>{closeComment();showToast(newStatus==='approved'?'Отчёт одобрен':'Отчёт отклонён',newStatus==='approved'?'ok':'reject')}).catch(e=>showToast('Ошибка: '+e.message,'reject'))}

function exportPDF(id){
  const report=allReports.find(r=>r.id===id);
  if(!report)return;
  showToast('Генерирую PDF...','ok');
  const tempDiv=document.createElement('div');
  tempDiv.style.cssText='position:fixed;left:-9999px;top:0;background:#fff;color:#000;padding:20px;width:600px;font-family:Arial';
  const date=report.createdAt?new Date(report.createdAt.seconds*1000).toLocaleDateString('ru-RU'):'—';
  const statusText={draft:'Черновик',pending:'На проверке',approved:'Одобрено',rejected:'Отклонено'}[report.status];
  
  let html='<h1 style="margin:0 0 8px;color:#6366f1">Отчёт: '+(report.workerName||report.workerEmail)+'</h1>';
  html+='<div style="color:#666;margin-bottom:20px"> Период: '+(report.workDate||'Не указана')+(report.workAddress?'<br> Адрес: '+report.workAddress:'')+'<br>Создан: '+date+' · '+statusText+'</div>';
  html+='<table style="width:100%;border-collapse:collapse;margin-bottom:20px">';
  html+='<thead><tr style="background:#f0f0f0"><th style="padding:8px;border:1px solid #ddd;text-align:left;font-size:12px">Дата</th><th style="padding:8px;border:1px solid #ddd;text-align:left;font-size:12px">Адрес</th><th style="padding:8px;border:1px solid #ddd;text-align:left;font-size:12px">Работа</th><th style="padding:8px;border:1px solid #ddd;text-align:right;font-size:12px">Сумма</th></tr></thead>';
  html+='<tbody>';
  report.items.forEach(item=>{
    let priceText=item.totalPrice?item.totalPrice.toLocaleString('ru-RU')+' ₽':item.p.toLocaleString('ru-RU')+' ₽';
    if(item.perMeter)priceText+=' ('+item.meters+' м)';
    if(item.hasArea)priceText+=' ('+item.area+' м²'+(item.mountType==='high'?', высокий монтаж':'')+')';
    if(item.qty&&item.qty>1)priceText+=' × '+item.qty+' шт';
    html+='<tr>';
    html+='<td style="padding:8px;border:1px solid #ddd;font-size:12px">'+(item.workDate||'—')+'</td>';
    html+='<td style="padding:8px;border:1px solid #ddd;font-size:12px">'+(item.workAddress||'—')+'</td>';
    html+='<td style="padding:8px;border:1px solid #ddd;font-size:12px">'+(item.cat?item.cat+': ':'')+item.n+(item.isExtra?' (доп.)':'')+'</td>';
    html+='<td style="padding:8px;border:1px solid #ddd;font-size:12px;text-align:right;font-weight:bold">'+priceText+'</td>';
    html+='</tr>';
  });
  html+='</tbody></table>';
  const workTotal=report.total||0;
  const expenseAmount=report.expenseAmount||0;
  const grandTotal=workTotal+expenseAmount;
  html+='<div style="margin-top:20px;padding:12px;background:#f0f0f0;border-radius:8px;text-align:right"><div style="font-size:14px;color:#666">Итого за работы: '+workTotal.toLocaleString('ru-RU')+' ₽</div>';
  if(expenseAmount>0)html+='<div style="font-size:12px;color:#9a3412">Расходы: '+expenseAmount.toLocaleString('ru-RU')+' ₽</div>';
  html+='<div style="font-size:24px;font-weight:bold;color:#6366f1;margin-top:6px">Общая сумма: '+grandTotal.toLocaleString('ru-RU')+' ₽</div></div>';
  if(report.bossComment)html+='<div style="margin-top:12px;padding:10px;background:#fff3cd;border-radius:8px;border-left:3px solid #f59e0b"><b>Комментарий руководителя:</b> '+report.bossComment+'</div>';
  tempDiv.innerHTML=html;
  document.body.appendChild(tempDiv);
  html2canvas(tempDiv,{scale:2,backgroundColor:'#ffffff'}).then(canvas=>{
    const imgData=canvas.toDataURL('image/png');
    const{jsPDF}=window.jspdf;
    const pdf=new jsPDF('p','mm','a4');
    const imgWidth=210;
    const imgHeight=canvas.height*imgWidth/canvas.width;
    pdf.addImage(imgData,'PNG',0,0,imgWidth,imgHeight);
    pdf.save('Отчет_'+(report.workerName||report.workerEmail)+'_'+(report.workDate||date)+'.pdf');
    showToast('PDF сохранён','ok');
    document.body.removeChild(tempDiv);
  }).catch(e=>{showToast('Ошибка PDF: '+e.message,'reject');document.body.removeChild(tempDiv)})
}

function showMenu(){document.getElementById('menuModal').classList.add('show')}
function closeMenu(){document.getElementById('menuModal').classList.remove('show')}
document.querySelectorAll('.modal').forEach(m=>{m.addEventListener('click',e=>{if(e.target===m)m.classList.remove('show')})});
</script>
